<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Security Lab</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;background:#eef1f5;color:#1d2632;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(30,45,65,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(30,45,65,.045) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
main{max-width:1100px;margin:0 auto;padding:32px 20px 60px}
.card{background:rgba(255,255,255,.96);border:1px solid #d5dce5;border-radius:14px;padding:28px;box-shadow:0 18px 50px rgba(30,45,65,.10)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;border-bottom:1px solid #29313d;padding-bottom:20px;margin-bottom:25px}
.brand{font-size:11px;font-weight:700;letter-spacing:1.8px;color:#657386}
h1{font-size:32px;line-height:1.1;font-weight:650;letter-spacing:-.8px;margin:8px 0;color:#17212d}
.sub{color:#647286;font-size:14px;margin:0}
.status{font-size:11px;color:#657386;white-space:nowrap}.dot{display:inline-block;width:7px;height:7px;background:#5ee6a8;border-radius:50%;margin-right:7px;box-shadow:0 0 10px rgba(94,230,168,.6)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(max-width:700px){.grid{grid-template-columns:1fr}header{display:block}.status{margin-top:12px}}
label{display:block;color:#647286;font-size:11px;font-weight:650;letter-spacing:.8px;text-transform:uppercase;margin-bottom:7px}
input,select{width:100%;padding:11px 12px;background:#f7f9fb;border:1px solid #303946;border-radius:8px;color:#1d2632;font:inherit;font-size:14px;transition:.15s}
input:focus,select:focus{outline:none;border-color:#8fa0b2;box-shadow:0 0 0 3px rgba(96,112,132,.10)}
.check{display:flex;align-items:center;gap:9px;margin-top:16px;color:#657386;font-size:12px;text-transform:none;letter-spacing:0;font-weight:400}.check input{width:auto}
button{width:100%;margin-top:19px;padding:12px 14px;background:#243242;color:#fff;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;transition:.15s}
button:hover{background:#33465a;transform:translateY(-1px)}button:disabled{opacity:.5;cursor:wait;transform:none}
.info{margin-top:20px;padding:13px 14px;border:1px solid #d5dce5;background:#f7f9fb;border-radius:9px;color:#7f8a9a;font-size:11px}
.stats{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0 15px}
.stat{min-width:105px;padding:11px 12px;background:#f8fafc;border:1px solid #d5dce5;border-radius:9px}
.stat b{display:block;color:#1d2632;font-size:18px}.muted{color:#707b8b;font-size:9px;text-transform:uppercase;letter-spacing:.6px}
h2{font-size:16px;font-weight:650;color:#dbe1e9;margin:20px 0 10px}
.list{max-height:70vh;overflow:auto;border:1px solid #d5dce5;border-radius:9px;background:#f8fafc}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 11px;border-bottom:1px solid #1d242d;font-size:12px}.row:last-child{border-bottom:0}.row:hover{background:#eef3f7}
.badge{padding:3px 7px;border:1px solid #303946;background:#eef2f6;color:#8f9aaa;border-radius:5px;font-size:9px}.ai{color:#526173}
.weak{color:#b64c58}.medium{color:#9a761d}.strong{color:#2c8054}.bruh{color:#b64c58;font-weight:700}.unpredictable{color:#c4ccd7;font-weight:700}
.loader{margin-top:20px;padding:17px;border:1px solid #d5dce5;border-radius:9px;background:#f5f7fa}.terminal{min-height:24px;color:#526173;font-size:12px}.bar{height:5px;background:#dbe2ea;overflow:hidden;border-radius:5px;margin:13px 0 8px}.fill{height:100%;width:0;background:#51677e}.percent{color:#1d2632;font-size:17px;font-weight:650}.funny{margin-top:7px;color:#718096;font-size:10px}.note{margin-top:12px;color:#718096;font-size:11px}
</style>
</head>
<body>
<main>
  <div class="card">
    <header>
      <div class="brand">PASSWORD SECURITY LAB <span style="color:#cbd5e1">/</span> LOCAL AUDIT</div>
      <h1>Password Security Lab</h1>
      <p class="sub">Modern password-pattern analysis for fictional data. Local simulation only.</p>
    <div class="status"><span class="dot"></span>ENGINE READY</div></header>

    <div class="section">
      <div class="grid">
        <div>
          <label for="name">Fictional name</label>
          <input id="name" placeholder="Alex Morgan">
        </div>
        <div>
          <label for="dob">Fictional date of birth</label>
          <input id="dob" type="date">
        </div>
        <div>
          <label for="type">Pattern type</label>
          <select id="type">
            <option value="all">All patterns</option>
            <option value="numbers">Numbers only</option>
            <option value="words">Words + numbers</option>
            <option value="mixed">Mixed characters</option>
          </select>
        </div>
        <div>
          <label for="count">How many examples</label>
          <select id="count">
            <option value="1000">1,000</option>
            <option value="3000" selected>3,000</option>
            <option value="5000">5,000</option>
          </select>
        </div>
        <div>
          <label for="sort">Sort by</label>
          <select id="sort">
            <option value="generated">Generated order</option>
            <option value="ai-likely">Pattern score</option>
            <option value="strength-desc">Strongest first</option>
            <option value="strength-asc">Weakest first</option>
            <option value="length-desc">Longest first</option>
            <option value="length-asc">Shortest first</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
          </select>
        </div>
      </div>

      <label class="check">
        <input id="chaos" type="checkbox" checked>
        Include random high-entropy examples
      </label>

      <button id="go" type="button">Generate example passwords</button>

      <div id="out"></div>

      <div class="info">
        This page uses fictional data only. It does not test accounts, websites, or real passwords.
      </div>
    </div>
  </div>
</main>
<script defer src="script.js"></script>
</body>
</html>
