<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Security Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b12;color:#e8f0ff;font-family:Inter,system-ui,sans-serif;min-height:100vh}
main{max-width:1000px;margin:auto;padding:34px 18px}.card{background:#0e1522;border:1px solid #26344a;border-radius:18px;padding:24px;box-shadow:0 18px 50px #0008}
h1{margin:0 0 8px;font-size:32px}.sub{color:#9eacc0;margin-bottom:20px}.safe{display:inline-block;color:#7ee2a8;background:#123322;border:1px solid #245f3c;padding:6px 10px;border-radius:999px;font-size:13px}
.grid,.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:650px){.grid,.controls{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:#aebbd0;margin-bottom:6px}input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #30415a;background:#080e18;color:white;font-size:16px}
.controls{margin-top:14px}.check{display:flex;align-items:center;gap:8px;margin-top:12px;color:#aebbd0;font-size:13px}.check input{width:auto}
button{margin-top:18px;width:100%;padding:13px;border:0;border-radius:10px;background:#4d8dff;color:white;font-weight:700;font-size:16px;cursor:pointer}button:hover{filter:brightness(1.1)}button:disabled{opacity:.6;cursor:wait}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.stat{background:#09101b;border:1px solid #1e2b3e;border-radius:10px;padding:10px 14px}.stat b{display:block;font-size:20px}.muted{color:#8e9cb0;font-size:12px}
#out{margin-top:22px}.list{max-height:500px;overflow:auto}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;margin:6px 0;background:#09101b;border:1px solid #1e2b3e;border-radius:10px;font-family:ui-monospace,monospace}.weak{color:#ffbd70}.medium{color:#ffe27a}.strong{color:#7ee2a8}.bruh{color:#ff6b6b;font-weight:800}.unpredictable{color:#b995ff;font-weight:800}.badge{padding:3px 8px;border-radius:999px;background:#172338;font-size:12px;white-space:nowrap}
.note{margin-top:18px;padding:12px;border-radius:10px;background:#111c2c;color:#aebbd0;font-size:13px;line-height:1.5}
.loader{margin-top:22px;padding:24px;background:#050911;border:1px solid #26344a;border-radius:14px;text-align:center}.terminal{font-family:ui-monospace,monospace;color:#7ee2a8;min-height:48px;font-size:14px}.bar{height:10px;background:#172338;border-radius:99px;overflow:hidden;margin:18px 0 10px}.fill{height:100%;width:0;background:#4d8dff;transition:width .2s linear}.percent{font-size:28px;font-weight:800}.funny{color:#aebbd0;margin-top:8px}
</style></head>
<body><main><div class="card">
<span class="safe">SAFE SIMULATOR • FICTIONAL DATA ONLY</span>
<h1>Password Security Lab</h1>
<div class="sub">Advanced local pattern analysis for fictional characters.</div>
<div class="grid">
<div><label>Fictional name</label><input id="name" placeholder="Alex Morgan"></div>
<div><label>Fictional date of birth</label><input id="dob" type="date"></div>
</div>
<div class="controls">
<div><label>Pattern type</label><select id="type"><option value="all">All patterns</option><option value="numbers">Numbers only</option><option value="words">Words + numbers</option><option value="mixed">Mixed characters</option></select></div>
<div><label>How many examples</label><select id="count"><option value="1000">1,000</option><option value="3000" selected>3,000</option><option value="5000">5,000</option></select></div>
<div><label>Sort by</label><select id="sort"><option value="generated">Generated order</option><option value="strength-desc">Strongest first</option><option value="strength-asc">Weakest first</option><option value="length-desc">Longest first</option><option value="length-asc">Shortest first</option><option value="az">A → Z</option><option value="za">Z → A</option></select></div>
</div>
<label class="check"><input id="chaos" type="checkbox" checked> Include advanced random-looking patterns</label>
<button id="go">RUN ADVANCED SIMULATION</button>
<div id="out"></div>
<div class="note">Fictional characters only. Everything runs locally in your browser and is never submitted to an account or website. The loading sequence is just a fun simulation.</div>
</div></main>
<script>
const out=document.getElementById('out'),go=document.getElementById('go');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}
function analyze(p,first,last,y,m,d){
 let obvious=0;const low=p.toLowerCase(),personal=[first,last,String(y),String(y).slice(-2),String(m).padStart(2,'0'),String(d).padStart(2,'0')];
 personal.forEach(x=>{if(x.length>1&&low.includes(x))obvious++});
 const unique=new Set(p).size,variety=(/[a-z]/.test(p)?1:0)+(/[A-Z]/.test(p)?1:0)+(/[0-9]/.test(p)?1:0)+(/[^A-Za-z0-9]/.test(p)?1:0);
 if(obvious>=2||p.length<7)return ['BRUH','bruh'];if(obvious===1)return ['WEAK','weak'];
 if(p.length<10||variety<2)return ['MEDIUM','medium'];if(p.length<13||unique<8||variety<3)return ['STRONG','strong'];
 if(p.length>=16&&variety>=3&&unique>=10)return ['UNGUESSABLE*','unpredictable'];return ['VERY STRONG','strong'];
}
function numeric(r,y,m,d,i){const patterns=[String(y),String(y).slice(-2)+String(m).padStart(2,'0')+String(d).padStart(2,'0'),String(m).padStart(2,'0')+String(d).padStart(2,'0')+String(y).slice(-2),String(d).padStart(2,'0')+String(m).padStart(2,'0')+String(y),String(Math.floor(r()*900000)+100000),String(Math.floor(r()*90000000)+10000000),String((i*37)%1000000).padStart(6,'0')];return patterns[i%patterns.length]}
const letters='abcdefghijklmnopqrstuvwxyz',symbols='!@#$%^&*_+=?';
function rndLen(r,n){return Math.floor(r()*n)}
function randomish(r,n,withSymbols){let p='';for(let i=0;i<n;i++){let q=r();if(q<.42)p+=letters[Math.floor(r()*26)];else if(q<.78)p+=letters[Math.floor(r()*26)].toUpperCase();else if(q<.93)p+=Math.floor(r()*10);else if(withSymbols)p+=symbols[Math.floor(r()*symbols.length)];else p+=Math.floor(r()*10)}return p}
function advancedPattern(r,first,last,y,m,d){
 const year=String(y), yy=year.slice(-2), mm=String(m).padStart(2,'0'), dd=String(d).padStart(2,'0');
 const clean=s=>s.replace(/[^a-z]/gi,'');
 const f=clean(first),l=clean(last);
 const leet=s=>s.replace(/a/gi,'4').replace(/e/gi,'3').replace(/i/gi,'1').replace(/o/gi,'0').replace(/s/gi,'5');
 const variants=[
   f+dd+yy, l+mm+yy, f+'_'+l, f+'.'+l, f+'-'+l,
   leet(f)+yy, leet(l)+dd, f.toUpperCase()+mm,
   f+l+dd, l+f+yy, f+dd+'!'+yy, f+'@'+mm+dd,
   randomish(r,18+rndLen(r,8),true),
   randomish(r,22+rndLen(r,10),true)
 ];
 return variants[Math.floor(r()*variants.length)];
}
function generate(name,dob){
 const parts=name.toLowerCase().split(/\s+/).filter(Boolean),first=parts[0]||'alex',last=parts.at(-1)||'morgan';
 const [y,m,d]=dob.split('-').map(Number),seed=hash(name+'|'+dob),r=rng(seed),type=document.getElementById('type').value,count=Number(document.getElementById('count').value),chaos=document.getElementById('chaos').checked;
 const set=new Set(),base=[first,last,first+last,last+first],suffix=['123','1234','1','01','12','21',String(y).slice(-2),String(y),String(m).padStart(2,'0'),String(d).padStart(2,'0')];let guard=0;
 while(set.size<count&&guard<count*10){guard++;let p='';
  if(type==='numbers'||(type==='all'&&r()<.25))p=numeric(r,y,m,d,guard);
  else if(chaos&&(type==='mixed'||type==='all')&&r()<.32)p=advancedPattern(r,first,last,y,m,d);
  else{let w=base[Math.floor(r()*base.length)],s=suffix[Math.floor(r()*suffix.length)];p=w+s;if(type==='mixed'||(type==='all'&&r()<.35))p+=symbols[Math.floor(r()*symbols.length)];if(r()<.25)p=p[0].toUpperCase()+p.slice(1);if(r()<.15)p+=Math.floor(r()*90+10)}
  if(type==='words'&&!/[A-Za-z]/.test(p))continue;set.add(p)
 }
 return {arr:[...set],first,last,y,m,d}
}
go.onclick=()=>{
 const name=document.getElementById('name').value.trim(),dob=document.getElementById('dob').value;
 if(!name||!dob){out.innerHTML='<p class="weak">Input valid date.</p>';return}
 const dateParts=dob.split('-').map(Number),validDate=dateParts.length===3&&dateParts.every(Number.isFinite)&&dateParts[0]>=1900&&dateParts[0]<=2026&&dateParts[1]>=1&&dateParts[1]<=12&&dateParts[2]>=1&&dateParts[2]<=31;
 if(!validDate){out.innerHTML='<p class="weak">Input valid date.</p>';return}
 go.disabled=true;
 const stages=['Connecting to the totally fictional mainframe...','Hacking the imaginary password matrix...','Bribing the virtual calculator...','Teaching the CPU suspicious math...','Scanning 3,000 fictional patterns...','Asking the pixels nicely...','Running advanced local analysis...','Almost done. Definitely not hacking anything.'];
 const start=performance.now(),duration=15000;
 out.innerHTML='<div class="loader"><div class="terminal" id="term" aria-live="polite">'+stages[0]+'</div><div class="bar"><div class="fill" id="fill"></div></div><div class="percent" id="pct">0%</div><div class="funny">Please wait while the extremely serious computer does extremely serious things. 😂</div></div>';
 const timer=setInterval(()=>{
   const elapsed=performance.now()-start,progress=Math.min(1,elapsed/duration),idx=Math.min(stages.length-1,Math.floor(progress*stages.length));
   document.getElementById('fill').style.width=(progress*100)+'%';document.getElementById('pct').textContent=Math.floor(progress*100)+'%';document.getElementById('term').textContent=stages[idx];
   if(progress>=1){clearInterval(timer);const result=generate(name,dob),arr=result.arr,labels=arr.map(x=>analyze(x,result.first,result.last,result.y,result.m,result.d)[0]);const counts={BRUH:0,WEAK:0,MEDIUM:0,STRONG:0,'VERY STRONG':0,'UNGUESSABLE*':0};labels.forEach(x=>counts[x]++);
   const sortMode=document.getElementById('sort').value;const rank={'BRUH':0,'WEAK':1,'MEDIUM':2,'STRONG':3,'VERY STRONG':4,'UNGUESSABLE*':5};const sorted=[...arr].sort((a,b)=>{if(sortMode==='strength-desc')return rank[analyze(b,result.first,result.last,result.y,result.m,result.d)[0]]-rank[analyze(a,result.first,result.last,result.y,result.m,result.d)[0]];if(sortMode==='strength-asc')return rank[analyze(a,result.first,result.last,result.y,result.m,result.d)[0]]-rank[analyze(b,result.first,result.last,result.y,result.m,result.d)[0]];if(sortMode==='length-desc')return b.length-a.length; if(sortMode==='length-asc')return a.length-b.length; if(sortMode==='az')return a.localeCompare(b);if(sortMode==='za')return b.localeCompare(a);return 0});const shown=sorted.slice(0,200);out.innerHTML='<div class="stats"><div class="stat"><b>'+arr.length.toLocaleString()+'</b><span class="muted">generated</span></div><div class="stat"><b>'+counts.BRUH+'</b><span class="muted">BRUH 💀</span></div><div class="stat"><b>'+counts.STRONG+'</b><span class="muted">strong</span></div><div class="stat"><b>'+counts['UNGUESSABLE*']+'</b><span class="muted">UNGUESSABLE*</span></div></div><h2>Advanced results</h2><div class="list">'+shown.map(p=>{let a=analyze(p,result.first,result.last,result.y,result.m,result.d);return '<div class="row"><span>'+esc(p)+'</span><span class="badge '+a[1]+'">'+a[0]+'</span></div>'}).join('')+'</div><p class="note">Showing '+shown.length+' of '+arr.length.toLocaleString()+' results. Sorted by '+esc(document.getElementById('sort').selectedOptions[0].text)+'. *“UNGUESSABLE” is a simulator label, not a security guarantee.</p>';go.disabled=false}
 },100);
};
</script></body></html>
