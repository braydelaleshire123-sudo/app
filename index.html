<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Security Lab</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#ddd;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;font-size:14px}
main{max-width:1100px;margin:0 auto;padding:22px}
.card{background:#151515;border:1px solid #333;border-radius:3px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
header{border-bottom:1px solid #333;padding-bottom:18px;margin-bottom:20px}
.brand{color:#aaa;font-size:13px}
h1{font-size:24px;font-weight:600;color:#eee;margin:8px 0}
.sub{color:#888;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
label{display:block;color:#999;font-size:12px;margin-bottom:6px}
input,select{width:100%;padding:9px 10px;background:#0d0d0d;border:1px solid #444;border-radius:2px;color:#ddd;font:inherit}
input:focus,select:focus{outline:none;border-color:#777}
.check{display:flex;align-items:center;gap:8px;margin-top:15px;color:#aaa}
.check input{width:auto}
button{width:100%;margin-top:18px;padding:10px;background:#222;border:1px solid #555;color:#eee;border-radius:2px;font:inherit;cursor:pointer}
button:hover{background:#2a2a2a}
button:disabled{opacity:.5;cursor:wait}
.info{margin-top:18px;padding:11px;border-left:3px solid #777;background:#101010;color:#888;font-size:12px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 14px}
.stat{min-width:100px;padding:9px 11px;background:#101010;border:1px solid #333}
.stat b{display:block;color:#eee;font-size:17px}
.muted{color:#777;font-size:10px}
h2{font-size:15px;font-weight:500;color:#bbb;margin:18px 0 9px}
.list{max-height:70vh;overflow:auto;border:1px solid #333;background:#0b0b0b}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;border-bottom:1px solid #222;font-size:12px}
.row:last-child{border-bottom:0}
.row:hover{background:#151515}
.badge{padding:2px 6px;border:1px solid #444;background:#151515;color:#999;font-size:10px}
.ai{color:#aaa}
.weak{color:#d88}.medium{color:#d0b46b}.strong{color:#8bc48b}.bruh{color:#d88;font-weight:700}.unpredictable{color:#aaa;font-weight:700}
.loader{margin-top:20px;padding:15px;border:1px solid #333;background:#0b0b0b}
.terminal{min-height:24px;color:#aaa}
.bar{height:5px;background:#252525;overflow:hidden;margin:12px 0 8px}
.fill{height:100%;width:0;background:#aaa}
.percent{color:#ddd;font-size:17px}
.funny{margin-top:7px;color:#666;font-size:10px}
.note{margin-top:12px;color:#666;font-size:11px}
</style>
</head>
<body>
<main>
  <div class="card">
    <header>
      <div class="brand">PASSWORD SECURITY LAB // LOCAL AUDIT MODE</div>
      <h1>password-security-lab</h1>
      <p class="sub">Terminal-style analysis of fictional password patterns. Local simulation only.</p>
    </header>

    <div class="section">
      <div class="grid">
        <div>
          <label for="name">Fictional name</label>
          <input id="name" placeholder="Alex Morgan">
        </div>
        <div>
          <label for="dob">Fictional date of birth</label>
          <input id="dob" type="date">
        </div>
        <div>
          <label for="type">Pattern type</label>
          <select id="type">
            <option value="all">All patterns</option>
            <option value="numbers">Numbers only</option>
            <option value="words">Words + numbers</option>
            <option value="mixed">Mixed characters</option>
          </select>
        </div>
        <div>
          <label for="count">How many examples</label>
          <select id="count">
            <option value="1000">1,000</option>
            <option value="3000" selected>3,000</option>
            <option value="5000">5,000</option>
          </select>
        </div>
        <div>
          <label for="sort">Sort by</label>
          <select id="sort">
            <option value="generated">Generated order</option>
            <option value="ai-likely">Pattern score</option>
            <option value="strength-desc">Strongest first</option>
            <option value="strength-asc">Weakest first</option>
            <option value="length-desc">Longest first</option>
            <option value="length-asc">Shortest first</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
          </select>
        </div>
      </div>

      <label class="check">
        <input id="chaos" type="checkbox" checked>
        Include random high-entropy examples
      </label>

      <button id="go" type="button">Generate example passwords</button>

      <div id="out"></div>

      <div class="info">
        This page uses fictional data only. It does not test accounts, websites, or real passwords.
      </div>
    </div>
  </div>
</main>
<script defer src="script.js"></script>
</body>
</html>
