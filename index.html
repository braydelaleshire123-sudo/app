<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Security Lab // NEXUS 2050</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#02040a;color:#dffcff;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(70,240,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(70,240,255,.025) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,#000,transparent 95%);z-index:5}
main{max-width:1180px;margin:auto;padding:22px 14px;position:relative;z-index:2}.card{background:linear-gradient(145deg,#071019,#04070d 65%);border:1px solid #164456;border-radius:12px;padding:20px;box-shadow:0 0 60px #00d9ff0c,0 25px 80px #000}
.top{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #164456;padding-bottom:13px;margin-bottom:18px}.brand{color:#55edff;font-weight:900;letter-spacing:3px}.status{color:#55edff;font-size:11px}.dot{display:inline-block;width:7px;height:7px;background:#55edff;border-radius:50%;box-shadow:0 0 12px #55edff;margin-right:7px}
h1{margin:0 0 6px;font-size:30px;color:#efffff;text-shadow:0 0 20px #36eaff35}.sub{color:#6799a8;margin-bottom:20px;font-size:12px}.safe{display:inline-block;color:#62f3c0;border:1px solid #176b58;background:#041812;padding:5px 9px;font-size:10px;letter-spacing:1px}
.grid,.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.grid,.controls{grid-template-columns:1fr}}
label{display:block;font-size:10px;color:#6ea6b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}input,select{width:100%;padding:12px;border-radius:5px;border:1px solid #1a5267;background:#02070c;color:#d9fbff;font:inherit;font-size:14px;outline:none}input:focus,select:focus{border-color:#43eaff;box-shadow:0 0 16px #43eaff18}
.controls{margin-top:12px}.check{display:flex;align-items:center;gap:8px;margin-top:12px;color:#6e9cac;font-size:11px;text-transform:none;letter-spacing:0}.check input{width:auto;accent-color:#43eaff}
button{margin-top:18px;width:100%;padding:14px;border:1px solid #43eaff;border-radius:5px;background:linear-gradient(90deg,#06222b,#09202a);color:#65f2ff;font:inherit;font-weight:900;letter-spacing:2px;cursor:pointer;box-shadow:inset 0 0 25px #43eaff0b,0 0 20px #43eaff09}button:hover{background:#0a2933;box-shadow:0 0 28px #43eaff20}button:disabled{opacity:.55;cursor:wait}
.future{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:9px;margin:16px 0}@media(max-width:760px){.future{grid-template-columns:1fr}}.module{border:1px solid #164456;background:#030a10;padding:11px;position:relative;overflow:hidden}.module:after{content:"";position:absolute;left:0;bottom:0;height:1px;width:55%;background:#43eaff;box-shadow:0 0 12px #43eaff}.module b{display:block;color:#55edff;font-size:16px}.module span{color:#557d89;font-size:9px;letter-spacing:1px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.stat{background:#03080d;border:1px solid #164456;padding:9px 12px;min-width:105px}.stat b{display:block;font-size:18px;color:#62f3ff}.muted{color:#527581;font-size:9px;text-transform:uppercase}
#out{margin-top:22px}.list{max-height:70vh;overflow:auto;border:1px solid #164456;padding:5px;background:#02060a}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;margin:3px 0;background:#040a10;border-left:2px solid #12516a;font-size:12px}.row:hover{background:#07151d}.weak{color:#ffb45f}.medium{color:#f0db67}.strong{color:#62f3c0}.bruh{color:#ff6877;font-weight:800}.unpredictable{color:#c99aff;font-weight:800}.badge{padding:2px 7px;border:1px solid #174c5f;background:#06131a;font-size:9px;white-space:nowrap}.ai{color:#55edff}
.note{margin-top:14px;padding:10px;border:1px solid #164456;background:#03080d;color:#587f8c;font-size:10px;line-height:1.5}
.loader{margin-top:22px;padding:20px;background:#010409;border:1px solid #1b596d;text-align:left}.terminal{color:#62f3ff;min-height:48px;font-size:12px;line-height:1.8}.terminal:before{content:"> ";color:#44eaff}.bar{height:7px;background:#07151c;overflow:hidden;margin:15px 0 9px}.fill{height:100%;width:0;background:#43eaff;box-shadow:0 0 15px #43eaff;transition:width .2s linear}.percent{font-size:22px;font-weight:900;color:#62f3ff}.funny{color:#41636e;margin-top:8px;font-size:10px}
</style></head>
<body><main><div class="card">
<div class="top"><div class="brand">NEXUS//SECURITY_OS 2050</div><div class="status"><span class="dot"></span>NEURAL CORE ONLINE // LOCAL</div></div>

<h1>Advanced Security Lab</h1>
<div class="sub">NEXT-GENERATION PATTERN ANALYSIS // SIMULATED 2050 INTERFACE</div>
<div class="future">
<div class="module"><b>NEURAL ANALYSIS</b><span>LOCAL HEURISTIC ENGINE // READY</span></div>
<div class="module"><b>99.8%</b><span>SYSTEM INTEGRITY</span></div>
<div class="module"><b>0 NET</b><span>NETWORK ACCESS</span></div>
</div>
<div class="grid">
<div><label>Fictional name</label><input id="name" placeholder="Alex Morgan"></div>
<div><label>Fictional date of birth</label><input id="dob" type="date"></div>
</div>
<div class="controls">
<div><label>Pattern type</label><select id="type"><option value="all">All patterns</option><option value="numbers">Numbers only</option><option value="words">Words + numbers</option><option value="mixed">Mixed characters</option></select></div>
<div><label>How many examples</label><select id="count"><option value="1000">1,000</option><option value="3000" selected>3,000</option><option value="5000">5,000</option></select></div>
<div><label>Sort by</label><select id="sort"><option value="generated">Generated order</option><option value="ai-likely">AI pattern score (simulated)</option><option value="strength-desc">Strongest first</option><option value="strength-asc">Weakest first</option><option value="length-desc">Longest first</option><option value="length-asc">Shortest first</option><option value="az">A → Z</option><option value="za">Z → A</option></select></div>
</div>
<label class="check"><input id="chaos" type="checkbox" checked> Enable synthetic high-entropy patterns</label>
<button id="go" type="button">[ INITIALIZE QUANTUM-STYLE SIMULATION ]</button>
<div id="out"></div>
</div></main>
<script>
const out=document.getElementById('out'),go=document.getElementById('go');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}
function analyze(p,first,last,y,m,d){let obvious=0;const low=p.toLowerCase(),personal=[first,last,String(y),String(y).slice(-2),String(m).padStart(2,'0'),String(d).padStart(2,'0')];personal.forEach(x=>{if(x.length>1&&low.includes(x))obvious++});const unique=new Set(p).size,variety=(/[a-z]/.test(p)?1:0)+(/[A-Z]/.test(p)?1:0)+(/[0-9]/.test(p)?1:0)+(/[^A-Za-z0-9]/.test(p)?1:0);if(obvious>=2||p.length<7)return ['BRUH','bruh'];if(obvious===1)return ['WEAK','weak'];if(p.length<10||variety<2)return ['MEDIUM','medium'];if(p.length<13||unique<8||variety<3)return ['STRONG','strong'];if(p.length>=16&&variety>=3&&unique>=10)return ['UNGUESSABLE*','unpredictable'];return ['VERY STRONG','strong']}
function aiPatternScore(p,first,last,y,m,d){const low=p.toLowerCase();let score=0;if(low.includes(first.toLowerCase()))score+=34;if(low.includes(last.toLowerCase()))score+=28;if(low.includes(String(y)))score+=22;if(low.includes(String(y).slice(-2)))score+=10;if(low.includes(String(m).padStart(2,'0')))score+=6;if(low.includes(String(d).padStart(2,'0')))score+=6;if(/(123|1234|111|000|qwerty|password|admin)/i.test(p))score+=20;if(/^[a-z]+\d+$/i.test(p))score+=12;if(/[!@#$%^&*]/.test(p))score+=2;if(p.length<=8)score+=12;else if(p.length<=10)score+=7;else if(p.length>=16)score-=8;return Math.max(0,Math.min(99,score))}
function numeric(r,y,m,d,i){const patterns=[String(y),String(y).slice(-2)+String(m).padStart(2,'0')+String(d).padStart(2,'0'),String(m).padStart(2,'0')+String(d).padStart(2,'0')+String(y).slice(-2),String(d).padStart(2,'0')+String(m).padStart(2,'0')+String(y),String(Math.floor(r()*900000)+100000),String(Math.floor(r()*90000000)+10000000),String((i*37)%1000000).padStart(6,'0')];return patterns[i%patterns.length]}
const letters='abcdefghijklmnopqrstuvwxyz',symbols='!@#$%^&*_+=?';
function rndLen(r,n){return Math.floor(r()*n)}
function randomish(r,n,withSymbols){let p='';for(let i=0;i<n;i++){let q=r();if(q<.42)p+=letters[Math.floor(r()*26)];else if(q<.78)p+=letters[Math.floor(r()*26)].toUpperCase();else if(q<.93)p+=Math.floor(r()*10);else if(withSymbols)p+=symbols[Math.floor(r()*symbols.length)];else p+=Math.floor(r()*10)}return p}
function advancedPattern(r,first,last,y,m,d){const year=String(y),yy=year.slice(-2),mm=String(m).padStart(2,'0'),dd=String(d).padStart(2,'0');const clean=s=>s.replace(/[^a-z]/gi,'');const f=clean(first),l=clean(last);const leet=s=>s.replace(/a/gi,'4').replace(/e/gi,'3').replace(/i/gi,'1').replace(/o/gi,'0').replace(/s/gi,'5');const variants=[f+dd+yy,l+mm+yy,f+'_'+l,f+'.'+l,f+'-'+l,leet(f)+yy,leet(l)+dd,f.toUpperCase()+mm,f+l+dd,l+f+yy,f+dd+'!'+yy,f+'@'+mm+dd,randomish(r,18+rndLen(r,8),true),randomish(r,22+rndLen(r,10),true)];return variants[Math.floor(r()*variants.length)]}
function generate(name,dob){const parts=name.toLowerCase().split(/\s+/).filter(Boolean),first=parts[0]||'alex',last=parts.at(-1)||'morgan';const [y,m,d]=dob.split('-').map(Number),seed=hash(name+'|'+dob),r=rng(seed),type=document.getElementById('type').value,count=Number(document.getElementById('count').value),chaos=document.getElementById('chaos').checked;const set=new Set(),base=[first,last,first+last,last+first],suffix=['123','1234','1','01','12','21',String(y).slice(-2),String(y),String(m).padStart(2,'0'),String(d).padStart(2,'0')];let guard=0;while(set.size<count){guard++;let p='';if(type==='numbers'||(type==='all'&&r()<.25))p=numeric(r,y,m,d,guard);else if(chaos&&(type==='mixed'||type==='all')&&r()<.32)p=advancedPattern(r,first,last,y,m,d);else{let w=base[Math.floor(r()*base.length)],s=suffix[Math.floor(r()*suffix.length)];p=w+s;if(type==='mixed'||(type==='all'&&r()<.35))p+=symbols[Math.floor(r()*symbols.length)];if(r()<.25)p=p[0].toUpperCase()+p.slice(1);if(r()<.15)p+=Math.floor(r()*90+10)}if(type==='words'&&!/[A-Za-z]/.test(p))continue;if(set.has(p)){const n=guard.toString(36);if(type==='numbers')p=(guard%100000000).toString().padStart(8,'0');else if(type==='words')p=first+n;else p=first+n+'!'+(guard%1000)}set.add(p)}return{arr:[...set],first,last,y,m,d}}
function sortRows(rows,mode){const rank={'bruh':0,'weak':1,'medium':2,'strong':3,'very strong':4,'unpredictable':5};rows.sort((a,b)=>{const pa=a.querySelector('.p').textContent,pb=b.querySelector('.p').textContent,ba=a.querySelector('.strength').textContent.trim().toLowerCase(),bb=b.querySelector('.strength').textContent.trim().toLowerCase();if(mode==='ai-likely')return Number(b.dataset.ai)-Number(a.dataset.ai);if(mode==='strength-desc')return rank[bb]-rank[ba];if(mode==='strength-asc')return rank[ba]-rank[bb];if(mode==='length-desc')return pb.length-pa.length;if(mode==='length-asc')return pa.length-pb.length;if(mode==='az')return pa.localeCompare(pb);if(mode==='za')return pb.localeCompare(pa);if(mode==='generated')return Number(a.dataset.order)-Number(b.dataset.order);return 0})}
go.onclick=()=>{if(go.disabled)return;const name=document.getElementById('name').value.trim(),dob=document.getElementById('dob').value;if(!name){out.innerHTML='<p class="weak">> INPUT ERROR: NAME REQUIRED</p>';return}if(!dob){out.innerHTML='<p class="weak">> INPUT ERROR: VALID DATE REQUIRED</p>';return}const dateParts=dob.split('-').map(Number),validDate=dateParts.length===3&&dateParts.every(Number.isFinite);const validCalendarDate=validDate&&dateParts[0]>=1900&&dateParts[0]<=2026&&dateParts[1]>=1&&dateParts[1]<=12&&dateParts[2]>=1&&dateParts[2]<=31&&new Date(dateParts[0],dateParts[1]-1,dateParts[2]).getFullYear()===dateParts[0]&&new Date(dateParts[0],dateParts[1]-1,dateParts[2]).getMonth()===dateParts[1]-1&&new Date(dateParts[0],dateParts[1]-1,dateParts[2]).getDate()===dateParts[2];if(!validCalendarDate){out.innerHTML='<p class="weak">> INPUT ERROR: VALID DATE REQUIRED</p>';return}go.disabled=true;const stages=['BOOTING NEXUS SECURITY OS...','INITIALIZING NEURAL SIMULATION CORE...','BUILDING SYNTHETIC PATTERN SPACE...','RUNNING MULTI-LAYER HEURISTICS...','CALCULATING AI-STYLE PATTERN SCORES...','MAPPING ENTROPY + CHARACTER DIVERSITY...','FINALIZING HOLOGRAPHIC RESULT BUFFER...','PROCESS COMPLETE // LOCAL ONLY'];const start=performance.now(),duration=15000;out.innerHTML='<div class="loader"><div class="terminal" id="term" aria-live="polite">'+stages[0]+'</div><div class="bar"><div class="fill" id="fill"></div></div><div class="percent" id="pct">0%</div><div class="funny">NEXUS CORE // SYNTHETIC SIMULATION // NO NETWORK ACCESS</div></div>';const timer=setInterval(()=>{const elapsed=performance.now()-start,progress=Math.min(1,elapsed/duration),idx=Math.min(stages.length-1,Math.floor(progress*stages.length));document.getElementById('fill').style.width=(progress*100)+'%';document.getElementById('pct').textContent=Math.floor(progress*100)+'%';document.getElementById('term').textContent=stages[idx];if(progress>=1){clearInterval(timer);const result=generate(name,dob),arr=result.arr,labels=arr.map(x=>analyze(x,result.first,result.last,result.y,result.m,result.d)[0]);const counts={BRUH:0,WEAK:0,MEDIUM:0,STRONG:0,'VERY STRONG':0,'UNGUESSABLE*':0};labels.forEach(x=>counts[x]++);const sortMode=document.getElementById('sort').value;const rank={'BRUH':0,'WEAK':1,'MEDIUM':2,'STRONG':3,'VERY STRONG':4,'UNGUESSABLE*':5};const sorted=[...arr].sort((a,b)=>{if(sortMode==='ai-likely')return aiPatternScore(b,result.first,result.last,result.y,result.m,result.d)-aiPatternScore(a,result.first,result.last,result.y,result.m,result.d);if(sortMode==='strength-desc')return rank[analyze(b,result.first,result.last,result.y,result.m,result.d)[0]]-rank[analyze(a,result.first,result.last,result.y,result.m,result.d)[0]];if(sortMode==='strength-asc')return rank[analyze(a,result.first,result.last,result.y,result.m,result.d)[0]]-rank[analyze(b,result.first,result.last,result.y,result.m,result.d)[0]];if(sortMode==='length-desc')return b.length-a.length;if(sortMode==='length-asc')return a.length-b.length;if(sortMode==='az')return a.localeCompare(b);if(sortMode==='za')return b.localeCompare(a);return 0});out.innerHTML='<div class="stats"><div class="stat"><b>'+arr.length.toLocaleString()+'</b><span class="muted">generated</span></div><div class="stat"><b>'+counts.BRUH+'</b><span class="muted">BRUH</span></div><div class="stat"><b>'+counts.WEAK+'</b><span class="muted">WEAK</span></div><div class="stat"><b>'+counts.MEDIUM+'</b><span class="muted">MEDIUM</span></div><div class="stat"><b>'+counts.STRONG+'</b><span class="muted">STRONG</span></div><div class="stat"><b>'+counts['VERY STRONG']+'</b><span class="muted">VERY STRONG</span></div><div class="stat"><b>'+counts['UNGUESSABLE*']+'</b><span class="muted">UNGUESSABLE*</span></div></div><h2>NEURAL RESULT BUFFER // '+sorted.length.toLocaleString()+' RECORDS</h2><div class="list">'+sorted.map(p=>{let a=analyze(p,result.first,result.last,result.y,result.m,result.d),score=aiPatternScore(p,result.first,result.last,result.y,result.m,result.d);return '<div class="row" data-order="'+arr.indexOf(p)+'" data-ai="'+score+'"><span class="p">'+esc(p)+'</span><span><span class="badge ai">AI '+score+'%</span> <span class="badge strength '+a[1]+'">'+a[0]+'</span></span></div>'}).join('')+'</div><p class="note">Showing '+sorted.length.toLocaleString()+' results. Sorted by '+esc(document.getElementById('sort').selectedOptions[0].text)+'. AI score is a fictional local heuristic for this simulator and does not predict any real person's credentials.</p>';go.disabled=false}},100)}};
document.getElementById('sort').addEventListener('change',()=>{const list=document.querySelector('.list');if(!list)return;const rows=[...list.querySelectorAll('.row')];sortRows(rows,document.getElementById('sort').value);rows.forEach(row=>list.appendChild(row));const note=document.querySelector('#out > .note');if(note)note.innerHTML='Showing '+rows.length.toLocaleString()+' results. Sorted by '+esc(document.getElementById('sort').selectedOptions[0].text)+'. AI score is a fictional local heuristic.';});
</script></body></html>
